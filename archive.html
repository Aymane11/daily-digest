<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Digest — Archive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Kalam:wght@300;400;700&family=Special+Elite&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #ece7dc;
  color: #0d0d0d;
  font-family: 'Kalam', cursive;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

:root {
  --paper: #ece7dc;
  --card:  #faf7f0;
  --ink:   #0d0d0d;
  --ink-2: #6a6a6a;
  --accent:#c0392b;
  --hi:    #ffe89a;
  --rule:  #0d0d0d;
}

.sk-mono      { font-family: 'Special Elite', 'Courier New', monospace; }
.sk-box       { border: 1.5px solid var(--ink); background: transparent; position: relative; }
.sk-box-soft  { border: 1.25px solid #2a2a2a; background: transparent; }
.sk-rule      { height: 0; border: 0; border-top: 1.5px solid var(--ink); margin: 0; }
.sk-rule-thin { height: 0; border: 0; border-top: 1px solid var(--ink); margin: 0; }
.row  { display: flex; }
.col  { display: flex; flex-direction: column; }
.grow { flex: 1; }
.gap-3 { gap: 12px; }

.dd-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px;
}

.dd-module-h {
  display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
}
.dd-module-h .num   { font-size: 56px; font-weight: 700; line-height: 0.9; color: var(--accent); }
.dd-module-h .title { font-family: 'Special Elite', monospace; font-size: 12px; letter-spacing: 2px; }
.dd-module-h .right { font-family: 'Special Elite', monospace; font-size: 10px; letter-spacing: 1.5px; }

.archive-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px dashed var(--ink);
  text-decoration: none;
  color: inherit;
  transition: background 0.1s;
}
.archive-row:hover { background: var(--hi); }
.archive-row:last-child { border-bottom: none; }

.empty-state {
  padding: 48px 0;
  text-align: center;
}
</style>
</head>
<body>
<div class="dd-page">

  <header class="sk-box" style="background:var(--ink);color:var(--card);padding:14px 18px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="row gap-3" style="align-items:baseline">
        <span class="sk-mono" style="font-size:11px;letter-spacing:3px;color:var(--hi)">DAILY · DIGEST</span>
        <span style="font-size:28px;font-weight:700;letter-spacing:-0.5px">ARCHIVE</span>
      </div>
      <a href="index.html" class="sk-mono" style="font-size:10px;letter-spacing:1.5px;color:var(--hi)">← TODAY'S ISSUE</a>
    </div>
  </header>

  <div class="row gap-3" style="margin-top:8px;flex-wrap:wrap">
    <span class="sk-box-soft sk-mono" style="padding:4px 10px;font-size:10px">ALL ISSUES</span>
    <span class="sk-box-soft sk-mono" style="padding:4px 10px;font-size:10px">REVERSE CHRONOLOGICAL</span>
    <span class="sk-box-soft sk-mono" style="padding:4px 10px;font-size:10px">AI · TECH · ENGINEERING</span>
  </div>

  <main style="margin-top:16px">
    <section class="sk-box" style="padding:18px;background:var(--card)">
      <div class="dd-module-h">
        <div class="row gap-3" style="align-items:baseline">
          <span class="num">01</span>
          <span class="title">ALL ISSUES</span>
        </div>
        <span class="right" id="issue-count">0 ISSUES</span>
      </div>
      <hr class="sk-rule-thin" style="margin-bottom:14px" />

      <div id="archive-list">
        <div class="empty-state">
          <p class="sk-mono" style="font-size:11px;letter-spacing:2px;color:var(--ink-2);margin:0">
            NO ISSUES PUBLISHED YET
          </p>
          <p style="font-size:14px;margin:12px 0 0;color:var(--ink-2)">
            The first issue will appear here automatically.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer style="border-top:1.5px solid var(--ink);margin-top:24px;padding:12px 4px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <span class="sk-mono" style="font-size:10px;letter-spacing:2px">DAILY DIGEST · ARCHIVE</span>
      <span class="sk-mono" style="font-size:10px;letter-spacing:1.5px;color:var(--ink-2)">GRID 12 · GUTTER 24 · SET IN KALAM / SPECIAL ELITE</span>
      <a href="index.html" class="sk-mono" style="font-size:10px;letter-spacing:1.5px">← LATEST ISSUE</a>
    </div>
  </footer>

</div>
</body>
</html>
