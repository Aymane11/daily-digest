<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Digest — 404</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Kalam:wght@300;400;700&family=Special+Elite&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #ece7dc;
  color: #0d0d0d;
  font-family: 'Kalam', cursive;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

:root {
  --paper: #ece7dc;
  --card:  #faf7f0;
  --ink:   #0d0d0d;
  --ink-2: #6a6a6a;
  --accent:#c0392b;
  --hi:    #ffe89a;
}

.sk-mono      { font-family: 'Special Elite', 'Courier New', monospace; }
.sk-rule-thin { height: 0; border: 0; border-top: 1px solid var(--ink); margin: 0; }
.row  { display: flex; }
.gap-3 { gap: 12px; }
</style>
</head>
<body>

<div style="border:1.5px solid var(--ink);background:var(--card);padding:48px 56px;text-align:center;max-width:480px;width:100%;margin:28px">

  <div class="row gap-3" style="align-items:baseline;justify-content:center;margin-bottom:18px">
    <span style="font-size:96px;font-weight:700;line-height:0.9;color:var(--accent)">404</span>
  </div>
  <p class="sk-mono" style="font-size:10px;letter-spacing:3px;margin:0 0 18px">FILE · NOT · FOUND</p>
  <hr class="sk-rule-thin" style="margin-bottom:24px" />

  <p style="font-size:18px;font-weight:700;line-height:1.3;margin:0 0 12px">
    This page doesn't exist or has moved.
  </p>
  <p class="sk-mono" style="font-size:11px;line-height:1.6;color:var(--ink-2);margin:0 0 28px">
    PAST ISSUES ARE NEVER DELETED —<br />
    IF YOU HAD A LINK IT MAY HAVE CHANGED.
  </p>

  <hr class="sk-rule-thin" style="margin-bottom:20px" />

  <div class="row gap-3" style="justify-content:center">
    <a href="/" class="sk-mono" style="font-size:10px;letter-spacing:1.5px;padding:8px 16px;border:1.5px solid var(--ink)">← TODAY'S ISSUE</a>
    <a href="/archive.html" class="sk-mono" style="font-size:10px;letter-spacing:1.5px;padding:8px 16px;border:1.5px solid var(--ink)">ARCHIVE →</a>
  </div>

</div>

</body>
</html>
